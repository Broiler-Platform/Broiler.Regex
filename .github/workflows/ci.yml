name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.package-version }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.Regex.slnx -c Release --nologo "${args[@]}"

      - name: Test
        run: bash ./eng/run-tests.sh Release

      - name: Pack and verify every package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Verify consumer restore from nuget.org (dry run)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/verify-feed.ps1

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error

  # The architecture rules SL1 to SL10 and the contract checks C1, C3 and C5 (R10 of docs/roadmap.md section 6,
  # docs/conventions.md; bundle sjl-11-001's check E-3), each asserting exactly its rows of the starting violation
  # list, tests/Regex.Architecture.Tests/starting-violations.tsv, which SJL-11.2 shrinks to none. The build job runs
  # them with the rest of the solution as well; this job is their gate, on both platforms, because SL10 reads the
  # bytes each platform checks out.
  architecture-tests:
    name: Architecture tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build tests/Regex.Architecture.Tests -c Release --nologo
      - name: SL1 to SL10, C1, C3 and C5
        run: dotnet test tests/Regex.Architecture.Tests -c Release --no-build --nologo

  # The shared JavaScript libraries' convention 12 for Broiler.Regex (milestone SJL-11, R10 of
  # docs/roadmap.md section 6; bundle sjl-11-001's check E-2): the probe publishes with Broiler.VM's root
  # settings and no warning, leaves no managed assembly beside the native image, and gives the report the
  # same probe gives under the JIT, byte for byte. Since task 2.14 of SJL-11.2 it also runs bundle
  # sjl-11-001's part C: --adversarial over tests/Adversarial/corpus.tsv, each row in a child process of the
  # probe on a thread of the corpus's declared stack, failing on a row that differs from its declared status,
  # a child that ends abnormally or a row that waits (none may since task 2.8), under Native AOT and under the
  # JIT, the two reports compared byte for byte per RID. About 2 s under Native AOT and 6 s under the JIT on
  # linux-x64 locally. Since task 2.12 it also runs bundle sjl-11-001's part D: --vectors over tests/Vectors, the
  # pinned copy of Broiler.JS's regular-expression vectors, its pin checked first (a changed byte refuses the run,
  # exit 2), failing on a vector the rule holds to its out that does not give it, under Native AOT and under the JIT,
  # the two reports compared byte for byte per RID. About 1 s under Native AOT and 2 s under the JIT on linux-x64
  # locally; each step bounded by 10 minutes.
  native-aot-probe:
    name: Native AOT probe (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: Broiler.Regex.Probe
          - os: windows-latest
            rid: win-x64
            executable: Broiler.Regex.Probe.exe
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish with Native AOT
        run: |
          set -o pipefail
          dotnet publish probes/Regex.Probe -c Release -r ${{ matrix.rid }} --nologo 2>&1 | tee probe-publish.log
          # Warnings are errors already; this states the zero convention 12 asks for.
          if grep -E "warning [A-Z]+[0-9]+" probe-publish.log; then
            echo "::error::the Native AOT publish reported a warning"
            exit 1
          fi
          publish=probes/Regex.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish
          if ls "$publish"/*.dll >/dev/null 2>&1; then
            echo "::error::the publish directory holds a managed assembly"
            exit 1
          fi
      - name: Run the population under Native AOT
        run: ./probes/Regex.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.executable }} --report probe-aot.txt
      - name: Run the adversarial corpus under Native AOT
        timeout-minutes: 10
        run: ./probes/Regex.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.executable }} --adversarial tests/Adversarial/corpus.tsv --report adversarial-aot.txt
      - name: Run the vectors under Native AOT
        timeout-minutes: 10
        run: ./probes/Regex.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.executable }} --vectors tests/Vectors --report vectors-aot.txt > /dev/null
      - name: Run it under the JIT, and compare
        run: |
          dotnet build probes/Regex.Probe -c Release --nologo
          dotnet probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll --report probe-jit.txt
          cmp probe-aot.txt probe-jit.txt
      - name: Run the adversarial corpus under the JIT, and compare
        timeout-minutes: 10
        run: |
          dotnet probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll --adversarial tests/Adversarial/corpus.tsv --report adversarial-jit.txt
          cmp adversarial-aot.txt adversarial-jit.txt
      - name: Run the vectors under the JIT, and compare
        timeout-minutes: 10
        run: |
          dotnet probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll --vectors tests/Vectors --report vectors-jit.txt > /dev/null
          cmp vectors-aot.txt vectors-jit.txt
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-aot-probe-${{ matrix.rid }}
          path: |
            probe-publish.log
            probe-aot.txt
            probe-jit.txt
            adversarial-aot.txt
            adversarial-jit.txt
            vectors-aot.txt
            vectors-jit.txt
          if-no-files-found: warn

  # Bundle sjl-11-001's check B-2, the host-free library job of decision D14 (task 2.10 of SJL-11.2; R5, R6 and R10 of
  # docs/roadmap.md section 6): test262 at the pin, its commit and the git tree of its test/ checked first, through the
  # library runner of Broiler.Regex.Tests/Test262Library/ in the probe's --test262 mode: (i) every literal the runner's
  # declared grammar extracts from test/language/literals/regexp and test/annexB/language/literals/regexp, a negative
  # file's refused by the validate entry and by compile and a positive file's accepted; (ii)
  # test/built-ins/RegExp/property-escapes/generated and (iii) test/built-ins/RegExp/unicodeSets/generated through
  # their structured helpers, as harness/regExpUtils.js runs them; a file it cannot read listed, with why, in
  # test262/library-unreadable.txt, which must name exactly those. Under Native AOT and under the JIT, the two reports
  # compared byte for byte per RID; any file that fails, or a list that is not exact, fails the step. The host job,
  # B-1's test262-host, waits for Broiler.JS's SJL-11.5 branch (decision D35; docs/roadmap.md, task 2.10's record).
  test262-library:
    name: test262, the library job (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: Broiler.Regex.Probe
          - os: windows-latest
            rid: win-x64
            executable: Broiler.Regex.Probe.exe
    steps:
      - name: Check out
        uses: actions/checkout@v7
      # The runner reads the files' bytes, and the pin check below reads git's objects: on the Windows runner, whose
      # git converts line endings on checkout by default, test262 is checked out as committed, so the bytes read are
      # the objects' (added 2026-11-15, after the review of the tail; the runner's own config on the runner only).
      - name: Keep test262's line endings as committed
        run: git config --global core.autocrlf false
      - name: Check out test262 at the pin
        uses: actions/checkout@v7
        with:
          repository: tc39/test262
          ref: ccaac100ff49d81e9ff47a75ff4c60e0bd3f262e
          path: suite/test262
          persist-credentials: false
      - name: Check the pin
        run: |
          test "$(git -C suite/test262 rev-parse HEAD)" = ccaac100ff49d81e9ff47a75ff4c60e0bd3f262e
          test "$(git -C suite/test262 rev-parse HEAD:test)" = c022917030da8fbc09b7db8f9b7d55ccc5f5ebab
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish the probe with Native AOT
        run: dotnet publish probes/Regex.Probe -c Release -r ${{ matrix.rid }} --nologo
      - name: Run the library job under Native AOT
        timeout-minutes: 15
        run: |
          ./probes/Regex.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.executable }} --test262 suite/test262 --unreadable test262/library-unreadable.txt --report test262-library-aot.txt > /dev/null || { code=$?; grep -E '^FAIL' test262-library-aot.txt || true; exit $code; }
      - name: Run it under the JIT, and compare
        timeout-minutes: 15
        run: |
          dotnet build probes/Regex.Probe -c Release --nologo
          dotnet probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll --test262 suite/test262 --unreadable test262/library-unreadable.txt --report test262-library-jit.txt > /dev/null || { code=$?; grep -E '^FAIL' test262-library-jit.txt || true; exit $code; }
          cmp test262-library-aot.txt test262-library-jit.txt
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-library-${{ matrix.rid }}
          path: |
            test262-library-aot.txt
            test262-library-jit.txt
          if-no-files-found: warn

  # Part C's two controls (bundle sjl-11-001's decision rule; task 2.14 of SJL-11.2), each a scratch build of the probe
  # that compiles the library's sources into it with one declared line changed in a copy under obj/
  # (probes/Regex.Probe/AdversarialControls.targets), never building Broiler.Regex.dll: (1) LimitExceeded naming steps
  # answered NoMatch, which must report every K, A, L, W and G row; (2) the nesting check removed, which must report every
  # N row past the limit, each ending abnormally or differing. eng/adversarial-controls.py holds each report to exactly
  # the rows its control must report (the 17 K, A, L, W and G rows; the 15 N rows past the limit, the validate rows
  # among them since task 2.8), refusing a row that waits, and the revert, the probe built as usual again, to no row
  # reported. The library's DLL, built only by the revert, holds neither control's text. Under the JIT; 30 to 50 s of
  # builds and runs locally on linux-x64.
  adversarial-controls:
    name: Adversarial corpus, part C's controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Control 1, LimitExceeded naming steps answered NoMatch
        timeout-minutes: 10
        run: |
          dotnet build probes/Regex.Probe -c Release --nologo -p:RegexAdversarialControl=steps
          set +e
          dotnet probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll --adversarial tests/Adversarial/corpus.tsv --report control-steps.txt > /dev/null
          code=$?
          set -e
          python3 eng/adversarial-controls.py --control steps --corpus tests/Adversarial/corpus.tsv --report control-steps.txt --exit "$code"
          python3 eng/adversarial-controls.py --holds "adversarial control 1 (part C)" probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll
      - name: Control 2, the nesting check removed
        timeout-minutes: 10
        run: |
          dotnet build probes/Regex.Probe -c Release --nologo -p:RegexAdversarialControl=nesting
          set +e
          dotnet probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll --adversarial tests/Adversarial/corpus.tsv --report control-nesting.txt > /dev/null
          code=$?
          set -e
          python3 eng/adversarial-controls.py --control nesting --corpus tests/Adversarial/corpus.tsv --report control-nesting.txt --exit "$code"
          python3 eng/adversarial-controls.py --holds "adversarial control 2 (part C)" probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll
      - name: Neither control built the library
        run: |
          if [ -e Broiler.Regex/bin ]; then
            echo "::error::a control build built the library project"
            exit 1
          fi
      - name: The revert, every row its declared status, and no control in the library
        timeout-minutes: 10
        run: |
          dotnet build probes/Regex.Probe -c Release --nologo
          set +e
          dotnet probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll --adversarial tests/Adversarial/corpus.tsv --report revert.txt > /dev/null
          code=$?
          set -e
          python3 eng/adversarial-controls.py --control none --corpus tests/Adversarial/corpus.tsv --report revert.txt --exit "$code"
          python3 eng/adversarial-controls.py --lacks "adversarial control" --lacks RegexAdversarialControl Broiler.Regex/bin/Release/net10.0/Broiler.Regex.dll
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adversarial-controls
          path: |
            control-steps.txt
            control-nesting.txt
            revert.txt
          if-no-files-found: warn

  # The fuzz target (R10 of docs/roadmap.md section 6; decision D32 of Broiler.VM's JSD-0081; bundle sjl-11-001's
  # check E-5): tests/Regex.Fuzz runs its declared seed, 20261027, for its declared 24,000 iterations, every case
  # compiled with a nesting limit, a compile budget and a meter and matched through the offset entry and the
  # string-bearing members with every ceiling set, each child process on a 1 MiB stack. It fails on any finding its
  # known-findings.tsv does not list (an exception no entry documents, a disagreement between entries, a broken
  # contract, a process that ends or stops answering), on a listed finding the session no longer reaches, and on a
  # construct or outcome it did not reach (tests/Regex.Fuzz/README.md). About 30 s of the session on four cores.
  fuzz:
    name: Fuzz target (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build tests/Regex.Fuzz -c Release --nologo
      - name: The declared session
        timeout-minutes: 10
        run: |
          set -o pipefail
          dotnet tests/Regex.Fuzz/bin/Release/net10.0/Regex.Fuzz.dll 2>&1 | tee fuzz.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.os }}
          path: fuzz.log
          if-no-files-found: warn

  # D32's planted-defect control: a build in which one declared line of the parser, the v-mode class-set subtraction
  # of RegexParser.ParseClassSubtraction, throws an exception no entry documents. The build compiles the library's
  # sources into the fuzz target with that line replaced, under obj/, and never builds or changes Broiler.Regex.dll
  # (tests/Regex.Fuzz/Regex.Fuzz.csproj). The declared seed must report the plant as a finding within the declared
  # iterations; locally it does at iteration 52, in under a second.
  fuzz-control:
    name: Fuzz target, planted-defect control
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build with the declared defect planted
        run: dotnet build tests/Regex.Fuzz -c Release --nologo -p:RegexFuzzPlant=true
      - name: The declared seed finds it
        timeout-minutes: 10
        run: |
          set +e
          dotnet tests/Regex.Fuzz/bin/Release/net10.0/Regex.Fuzz.dll --stop-when-found "planted defect (D32 control)" > fuzz-control.log 2>&1
          code=$?
          set -e
          cat fuzz-control.log
          if [ "$code" -ne 1 ] || ! grep -q "FINDING at iteration .* planted defect (D32 control)" fuzz-control.log; then
            echo "::error::the declared seed did not report the planted defect (exit $code)"
            exit 1
          fi
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-control
          path: fuzz-control.log
          if-no-files-found: warn

  # The programme's convention 18 (rule SL8; bundle sjl-11-001's check E-6): every relevant unit of the
  # library carries its Hairs assurance annotation and the generated artefacts at the repository
  # root are current. A source change that leaves them behind fails here.
  assurance:
    name: Assurance check (SL8)
    runs-on: ubuntu-24.04
    steps:
      # The assurance tool is Hairs.Cli, restored from nuget.org as a local tool pinned in
      # .config/dotnet-tools.json (changed 2026-11-15: it was Broiler.Code's Broiler.Code.Review.Cli,
      # checked out beside this repository).
      - name: Check out Broiler.RegEx
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore Hairs.Cli
        run: dotnet tool restore
      - name: Check the library against its generated artefacts
        run: dotnet hairs assurance check --root .
