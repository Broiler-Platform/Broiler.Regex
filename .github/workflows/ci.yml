name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.package-version }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.Regex.slnx -c Release --nologo "${args[@]}"

      - name: Test
        run: bash ./eng/run-tests.sh Release

      - name: Pack and verify every package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Verify consumer restore from nuget.org (dry run)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/verify-feed.ps1

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error

  # The shared JavaScript libraries' convention 12 for Broiler.Regex (milestone SJL-11, R10 of
  # docs/roadmap.md section 6; bundle sjl-11-001's check E-2): the probe publishes with Broiler.VM's root
  # settings and no warning, leaves no managed assembly beside the native image, and gives the report the
  # same probe gives under the JIT, byte for byte.
  native-aot-probe:
    name: Native AOT probe (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: Broiler.Regex.Probe
          - os: windows-latest
            rid: win-x64
            executable: Broiler.Regex.Probe.exe
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish with Native AOT
        run: |
          set -o pipefail
          dotnet publish probes/Regex.Probe -c Release -r ${{ matrix.rid }} --nologo 2>&1 | tee probe-publish.log
          # Warnings are errors already; this states the zero convention 12 asks for.
          if grep -E "warning [A-Z]+[0-9]+" probe-publish.log; then
            echo "::error::the Native AOT publish reported a warning"
            exit 1
          fi
          publish=probes/Regex.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish
          if ls "$publish"/*.dll >/dev/null 2>&1; then
            echo "::error::the publish directory holds a managed assembly"
            exit 1
          fi
      - name: Run the population under Native AOT
        run: ./probes/Regex.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.executable }} --report probe-aot.txt
      - name: Run it under the JIT, and compare
        run: |
          dotnet build probes/Regex.Probe -c Release --nologo
          dotnet probes/Regex.Probe/bin/Release/net10.0/Broiler.Regex.Probe.dll --report probe-jit.txt
          cmp probe-aot.txt probe-jit.txt
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-aot-probe-${{ matrix.rid }}
          path: |
            probe-publish.log
            probe-aot.txt
            probe-jit.txt
          if-no-files-found: warn
